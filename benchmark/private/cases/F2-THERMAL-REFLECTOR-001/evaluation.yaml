schema_version: "2.0"
case_id: F2-THERMAL-REFLECTOR-001
evaluator: semantic_rubric_v1
reference_solution: reference-solution.md

capability_criteria:
  - id: conduction_volume
    weight: 0.25
    full_credit: Correctly integrates conduction by parts and gives the gradient-gradient volume term.
    partial_credit: Includes conduction but omits its integration region or test-function gradient.
    common_errors:
      - incorrect volume-term sign
      - missing test-function gradient
  - id: prescribed_flux_boundary
    weight: 0.20
    full_credit: Gives the prescribed inward heat-flux boundary term with the correct sign and region.
    partial_credit: Includes the prescribed-flux term but incompletely explains its sign or region.
  - id: convection_boundary
    weight: 0.25
    full_credit: Gives the positive convection residual under the supplied outward-flux convention.
    partial_credit: Includes convection with correct factors but does not make the sign convention clear.
    common_errors:
      - negative convection contribution under the supplied convention
  - id: essential_and_insulated_boundaries
    weight: 0.15
    full_credit: States that the test function vanishes on Gamma_D and Gamma_ad contributes zero.
    partial_credit: Correctly handles only one of the essential or insulated boundaries.
  - id: complete_residual
    weight: 0.15
    full_credit: Presents a complete residual with test function, integration regions, and consistent signs.
    partial_credit: The residual is substantially correct but omits one requested annotation.

hard_gates: []
