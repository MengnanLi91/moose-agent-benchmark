schema_version: "2.0"
case_id: F4-POROUS-SOLUTE-001
evaluator: semantic_rubric_v1
reference_solution: reference-solution.md

capability_criteria:
  - id: variables_and_mesh
    weight: 0.20
    full_credit: The submitted input defines both nonlinear variables and the supplied 1-D mesh.
    partial_credit: The variables or mesh are mostly correct but one required value is missing.
  - id: porous_flow_configuration
    weight: 0.25
    full_credit: Registers porepressure and C with one phase, two components, and correct object references.
    partial_credit: The PorousFlow setup is present but one variable, count, or reference is incorrect.
    common_errors:
      - omits C from porous_flow_vars
  - id: material_properties
    weight: 0.20
    full_credit: Preserves porosity, permeability, dispersivity, and required fluid properties.
    partial_credit: The material structure is correct but one supplied property is wrong or absent.
  - id: boundary_conditions
    weight: 0.15
    full_credit: Implements both pressure boundaries, inlet tracer value, and tracer outflow component.
    partial_credit: Most boundary conditions are present but one value or component is incorrect.
  - id: execution_and_outputs
    weight: 0.20
    full_credit: Preserves transient controls and writes both requested midpoint quantities to CSV.
    partial_credit: Execution is substantially correct but one time control or output is incomplete.

hard_gates:
  - id: input_validation
    description: MOOSE --check-input succeeds.
    kind: external
  - id: bounded_execution
    description: The authoritative bounded run completes successfully.
    kind: external
  - id: required_output_generation
    description: The requested midpoint QoI output is generated through final time.
    kind: external
  - id: semantic_preservation
    description: The input preserves all supplied physics, parameters, and references.
    kind: external
