schema_version: "2.0"
case_id: F1-SOLID-DUCT-BOWING-001
evaluator: semantic_rubric_v1
reference_solution: reference-solution.md

capability_criteria:
  - id: solved_and_prescribed_fields
    weight: 0.20
    full_credit: Identifies all three displacement components as solved and temperature as prescribed.
    partial_credit: Correctly distinguishes the fields but omits one displacement component.
  - id: governing_law_and_kinematics
    weight: 0.20
    full_credit: States quasi-static momentum balance with the designated finite-strain kinematics.
    partial_credit: Gives the governing balance but omits or weakly identifies the kinematics.
  - id: elastic_constitutive_model
    weight: 0.15
    full_credit: Describes isotropic linear elasticity with Young's modulus and Poisson ratio.
    partial_credit: Identifies isotropic elasticity but omits a required closure parameter.
  - id: thermal_expansion_coupling
    weight: 0.25
    full_credit: Includes thermal-expansion eigenstrain with coefficient and stress-free temperature.
    partial_credit: Recognizes thermal expansion but incompletely states the eigenstrain closure.
    common_errors:
      - treats temperature as a solved thermal equation
      - omits thermal expansion
  - id: boundary_conditions
    weight: 0.10
    full_credit: Fixes all bottom displacements and treats remaining surfaces as traction free.
    partial_credit: States the bottom constraint but incompletely describes free surfaces.
  - id: quantities_of_interest
    weight: 0.10
    full_credit: Identifies lateral centerline displacements at all three requested elevations.
    partial_credit: Identifies duct bowing displacement but omits one requested elevation.

hard_gates: []
