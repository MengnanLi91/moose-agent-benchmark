- protected_error_oracle
- required_convergence
- reported_values_match
- resource_compliance
csv_path: mms.csv
error_columns:
  u: u_l2
secondary_metrics:
  domain_mean:
    column: domain_mean
    expected: 2.0
    tolerance:
      absolute: 1.0e-08
      relative: 1.0e-08
