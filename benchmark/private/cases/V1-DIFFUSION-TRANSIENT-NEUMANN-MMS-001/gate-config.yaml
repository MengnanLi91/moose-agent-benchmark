protected_hit_patterns:
- Functions/exact/type
- Functions/exact/expression
- Postprocessors/domain_mean/**
- Postprocessors/u_l2/**
- Outputs/csv
- Outputs/file_base
physics_requirements:
- pattern: Variables/u/order
  required_values:
  - FIRST
- pattern: Variables/u/family
  required_values:
  - LAGRANGE
- pattern: Kernels/*/type
  required_values:
  - TimeDerivative
  - Diffusion
- pattern: ICs/*/type
  required_values:
  - FunctionIC
- pattern: Executioner/type
  required_values:
  - Transient
- pattern: Executioner/scheme
  required_values:
  - implicit-euler
limits:
  wall_time_seconds: 600
  cpu_seconds: 480
  memory_mib: 4096
  max_output_bytes: 4194304
  max_processes: 32
