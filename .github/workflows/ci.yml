name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --locked

      - name: Static checks
        run: |
          uv run python -m compileall -q src tests ci
          uv run ruff check .
          uv run black --check .

      - name: Tests
        run: uv run pytest -q

      - name: Validate and score development fixtures
        run: |
          uv run moose-benchmark catalog validate --strict
          uv run moose-benchmark validate benchmark/manifest.yaml
          pairs=(
            "D1-SOLVER-DTMIN-001:D1-SOLVER-DTMIN-001-mutant-001"
            "D2-THERMAL-REL-TOL-001:D2-THERMAL-REL-TOL-001-mutant-001"
            "D3-PERIODIC-NODESET-001:D3-PERIODIC-NODESET-001-mutant-001"
            "D4-COUPLED-JACOBIAN-TEST-001:D4-COUPLED-JACOBIAN-TEST-001-mutant-001"
          )
          for pair in "${pairs[@]}"; do
            case_id="${pair%%:*}"
            mutant="${pair#*:}"
            uv run moose-benchmark score \
              --manifest benchmark/manifest.yaml \
              --case-id "$case_id" \
              --submission-dir "benchmark/example-submissions/$case_id" \
              --output "/tmp/$case_id-gold.json"
            uv run moose-benchmark score \
              --manifest benchmark/manifest.yaml \
              --case-id "$case_id" \
              --submission-dir "benchmark/example-submissions/$mutant" \
              --output "/tmp/$case_id-mutant.json"
            uv run python ci/assert_example_scores.py \
              "/tmp/$case_id-gold.json" \
              "/tmp/$case_id-mutant.json"
          done

      - name: Build release artifacts
        run: |
          uv build
          uv run python ci/build_public_bundle.py \
            --manifest benchmark/manifest.yaml \
            --output /tmp/moose-agent-benchmark-public.tar.gz
          ! tar -tzf /tmp/moose-agent-benchmark-public.tar.gz | grep -q private
