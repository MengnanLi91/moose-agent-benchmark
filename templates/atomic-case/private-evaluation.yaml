capability_criteria:
  - id: transient_term
    weight: 0.20
    full_credit: Includes the transient volume term with its coefficient and temperature test function.
    partial_credit: Includes the term but omits one supplied coefficient.
  - id: conduction_term
    weight: 0.30
    full_credit: Correctly integrates conduction by parts into the gradient-gradient volume term.
    partial_credit: Includes conduction but omits its sign, region, or test-function gradient.
  - id: source_term
    weight: 0.20
    full_credit: Includes the volumetric source with the correct sign and test function.
    partial_credit: Includes the source but omits one requested factor.
  - id: radiation_boundary
    weight: 0.30
    full_credit: Includes nonlinear radiation on the specified boundary with a consistent outward-normal sign.
    partial_credit: Includes radiation but incompletely states its region, factors, or sign convention.
